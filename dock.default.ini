; Liquid Glass Dock v1 default configuration
; Copy to %LOCALAPPDATA%\LiquidGlassDock\dock.ini before first launch to customize.
; Pins are ordered left to right.

[Dock]
ShowDevBounds=0
LaunchAtStartup=0
CheckForUpdates=0
; TypeSafeApiKey is optional (perf boost / startup AI). TYPESAFE_API_KEY preferred.
; Search AI answers (Ctrl+Enter) use your Groq API key: set it in Dock Settings (saved
; DPAPI-encrypted as GroqApiKey=dpapi:...) or via GROQ_API_KEY. AiModel defaults to qwen/qwen3.8-27b.
;AiModel=qwen/qwen3.8-27b
; Ctrl+Space opens Search. SearchHotkey=0 leaves Ctrl+Space to apps and input methods (e.g. IME toggle).
;SearchHotkey=1

[Pin0]
Name=File Explorer
Target=%SystemRoot%\explorer.exe
Arguments=
WorkingDirectory=

[Pin1]
Name=Notepad
Target=%SystemRoot%\System32\notepad.exe
Arguments=
WorkingDirectory=

[Pin2]
Name=Calculator
Target=shell:AppsFolder\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App
Arguments=
WorkingDirectory=
