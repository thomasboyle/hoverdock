name: Apply cursor lag patch (once)

on:
  push:
    branches:
      - fix/cursor-lag-lowlevel-hook-pump
    paths:
      - patches/fix-cursor-lag-lowlevel-hook.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: git apply --check patches/fix-cursor-lag-lowlevel-hook.patch && git apply patches/fix-cursor-lag-lowlevel-hook.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DockApp.cpp
          if git diff --staged --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "fix: restore low-level mouse hook message pump"
          git push
