name: apply-resting-page-faults

on:
  push:
    branches:
      - main
    paths:
      - .github/resting-page-faults.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Apply patch
        run: |
          set -eu
          if [ ! -f .github/resting-page-faults.patch ]; then
            echo "patch already consumed"
            exit 0
          fi
          git config user.name "Thomas Boyle"
          git config user.email "thomas.paul.boyle@gmail.com"
          git apply --whitespace=nowarn .github/resting-page-faults.patch
          test "$(git hash-object src/Renderer.cpp)" = "f9bada53e37191b46115eb456c14f71ed5fa54eb"
          test "$(git hash-object src/Renderer.h)" = "bd83df190b56f8d3563ef29a56ed459a906091e7"
          test "$(git hash-object src/DockApp.cpp)" = "c94e6d400e74b18d19fac5caf3f6440a3e3ecb5e"
          git add src/Renderer.cpp src/Renderer.h src/DockApp.cpp
          git rm -f .github/resting-page-faults.patch
          git commit -m "fix: stop resting page faults from backdrop capture and taskbar polling"
          git push origin HEAD:main

      - name: Record apply failure
        if: failure()
        run: |
          git config user.name "Thomas Boyle"
          git config user.email "thomas.paul.boyle@gmail.com"
          git apply --check --whitespace=nowarn .github/resting-page-faults.patch > .github/apply-error.txt 2>&1 || true
          git add .github/apply-error.txt
          git commit -m "chore: record page-fault patch apply error"
          git push origin HEAD:main
