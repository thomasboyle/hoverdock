name: Apply idle wake mask QS_PAINT fix
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/cpu-under-1pct-a6f3
    paths:
      - .github/workflows/apply-wake-mask-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/cpu-under-1pct-a6f3
          fetch-depth: 0
      - name: Patch idle wake mask in Run()
        run: |
          set -euxo pipefail
          file=src/DockApp.cpp
          if grep -q 'QS_POSTMESSAGE | QS_TIMER | QS_PAINT' "$file"; then
            echo "Wake mask already patched."
            git rm -f .github/workflows/apply-wake-mask-fix.yml || true
            if git diff --quiet; then exit 0; fi
          else
            sed -i 's/(QS_TIMER | QS_POSTMESSAGE)/(QS_POSTMESSAGE | QS_TIMER | QS_PAINT)/' "$file"
            grep -n 'wakeMask' "$file" | head -3
            git add "$file"
          fi
          git rm -f .github/workflows/apply-wake-mask-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix: include QS_PAINT in idle message-loop wake mask"
          git push origin HEAD:cursor/cpu-under-1pct-a6f3
